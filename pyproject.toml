[project]
name = "claudenstein"
version = "0.1.0"
description = "Self-improving robotics harness - generation 0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "pytest",
]

[project.optional-dependencies]
# CAD geometry validation. Heavy (OCP/OpenCascade). Not needed until a cycle
# commits a build123d design; install with `pip install -e .[cad]`.
cad = [
    "build123d",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["harness/tests"]
